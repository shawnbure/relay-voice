name: Relay
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  TelnyxRTC:
    path: Vendor/telnyx-webrtc-ios
targets:
  Relay:
    type: application
    platform: iOS
    sources: [Relay]
    resources: [Relay/Assets.xcassets]
    dependencies:
      - package: TelnyxRTC
        product: telnyx-webrtc-ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.relay
        RELAY_API_BASE_URL: https://relay.example.com
        PRODUCT_NAME: Relay
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Relay/Info.plist
        CODE_SIGN_ENTITLEMENTS: Relay/Relay.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
